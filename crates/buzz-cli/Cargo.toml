[package]
name = "buzz-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent-first CLI for Buzz relay"

[lib]
name = "buzz_cli"
path = "src/lib.rs"

[[bin]]
name = "buzz"
path = "src/main.rs"

[dependencies]
# CLI argument parsing — derive macros + env var support (BUZZ_API_TOKEN auto-wired)
clap = { version = "4", features = ["derive", "env"] }

# HTTP client — async REST calls to the relay
reqwest = { workspace = true, features = ["json"] }

# Async runtime — tokio macros + multi-thread for reqwest. `sync` and `time`
# are the search agent's: it shares one index between its ingest loop and its
# query endpoint (RwLock) and sleeps between cycles.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

# Serialization — JSON body building and response passthrough
serde = { workspace = true }
serde_json = { workspace = true }

# Structured error types with exit code mapping
thiserror = { workspace = true }

# Nostr event signing — used in `buzz auth`, auto-mint, and signed event writes
nostr = { workspace = true }

# UUID parsing for validate_uuid + event building
uuid = { workspace = true }

# RFC3339 observer timestamps for owner-reviewed agent draft requests
chrono = { workspace = true }

# Typed event builders for all write operations
buzz-sdk = { workspace = true }
buzz-core = { workspace = true }

# Channel-key primitives (key ids, NIP-44 seal/open) shared byte-for-byte with
# the desktop app — an agent-member seals and opens the same wire format a
# human client does.
buzz-channel-crypto = { workspace = true }

# Free NIP-01 reads from a TOON relay (`buzz toon inbox` / `read`). Not
# buzz-ws-client: that one's frame parser is strict NIP-01, and the devnet
# relay serves double-JSON-encoded EVENT payloads that a strict parser drops.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# Base64 encoding — NIP-98 event serialization for Authorization header
base64 = "0.22"

# SHA-256 — NIP-98 payload hash tag, Blossom file hash, mem patch base-hash
sha2 = "0.11"

# Unified-diff parser and strict applier — `mem patch`
diffy = "0.5"

# Hex encoding — SHA-256 hash output for Blossom uploads
hex = { workspace = true }

# Byte buffers returned by authenticated media downloads
bytes = "1"

# MIME type detection via magic bytes — file upload validation
infer = "0.19"

# URL parsing — extract server domain for Blossom auth tag
url = { workspace = true }

# Persona pack parsing, validation, and resolution
buzz-persona = { path = "../buzz-persona" }

# Platform app-data dir resolution — locates the desktop app's
# channel-templates.json store for `channels create --template`
dirs = "6"

# WebSocket client — ephemeral event publish (kind:20001 is WS-only on the relay)
buzz-ws-client = { path = "../buzz-ws-client" }

# HTTP server — the search agent's loopback query endpoint (`buzz toon
# search-agent`). Already in the tree as a dev-dependency for the stub relay
# and stub sidecar the agent e2e tests drive; the search agent is the first
# `buzz` subcommand that is itself a server, so it moves to a real dependency.
axum = { workspace = true }

# Explicit rustls dep with ring provider — required to install the process-level
# CryptoProvider at startup. Without this the standalone `buzz` binary panics when
# a multi-package release build (buzz-acp + buzz-dev-mcp + buzz-cli in one cargo
# invocation) unifies both ring and aws-lc-rs features, leaving rustls unable to
# auto-select a provider. See crates/buzz-acp/Cargo.toml for the same dependency.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Random number generation — full jitter for exponential backoff in with_retry
# and in the workflow agent's sidecar-down publish retry.
rand = { workspace = true }

# YAML workflow definitions for `buzz toon workflow-agent` (buzz#21) — the
# same crate `buzz-workflow` uses, so a v1 definition's error messages come
# from one parser the whole workspace already trusts.
serde_yaml = { workspace = true }

# `matches:` trigger conditions in a workflow definition.
regex = "1"

# `schedule:` cron triggers in a workflow definition (buzz#22 parity port) —
# the same crate `buzz-workflow` validates cron expressions with, so a
# `schedule.cron` string means the same thing in both engines.
cron = { workspace = true }

[dev-dependencies]
# Scratch files for channel-templates.json fixtures in tests
tempfile = "3"
# Minimal HTTP test server for retry/policy integration tests, and the stub
# relay (WebSocket) + stub sidecar the agent-membership e2e test drives
axum = { workspace = true }
# NIP-59 gift wrapping, test-only: the stub sidecar builds and opens real
# wraps rather than canned JSON, so the e2e test exercises the wire format the
# real toon-clientd endpoint will produce.
nostr = { workspace = true, features = ["nip59"] }
futures-util = { workspace = true }
